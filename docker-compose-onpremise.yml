services:
  # =========================
  # DATABASE
  # =========================

  postgres-operational:
    image: postgres:16
    container_name: postgres-operational
    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: finance_operational

    volumes:
      - postgres_operational_data:/var/lib/postgresql/data

  postgres-analytics:
    image: postgres:16
    container_name: postgres-analytics
    restart: unless-stopped

    ports:
      - "5433:5432"

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: finance_analytics

    volumes:
      - postgres_analytics_data:/var/lib/postgresql/data

  postgres-log:
    image: postgres:16
    container_name: postgres-log
    restart: unless-stopped

    ports:
      - "5434:5432"

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: finance_log

    volumes:
      - postgres_log_data:/var/lib/postgresql/data

  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: postgres-vector
    restart: unless-stopped

    ports:
      - "5435:5432"

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: finance_vector

    volumes:
      - postgres_vector_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  oracle-onpremise:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-onpremise
    restart: unless-stopped
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: 1234
      APP_USER: BANK
      APP_USER_PASSWORD: bank123
    healthcheck:
      test: [ "CMD", "healthcheck.sh" ]
      interval: 30s
      timeout: 10s
      retries: 20
    volumes:
      - oracle_onpremise_data:/opt/oracle/oradata
      - ./oracle-init:/container-entrypoint-initdb.d

  # =========================
  # KAFKA
  # =========================

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # =========================
  # AI
  # =========================

  #  ollama:
  #    image: ollama/ollama
  #    container_name: ollama
  #    restart: unless-stopped
  #    ports:
  #      - "11434:11434"
  #    volumes:
  #      - ollama_data:/root/.ollama

  # =========================
  # APPLICATIONS
  # =========================

  service-frontend:
    build:
      context: ../service-frontend
    container_name: service-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_AI_ORIGIN=http://service-ai-server:8000
      - NEXT_PUBLIC_API_ORIGIN=http://service-backend:8080
      - NEXT_PUBLIC_MYDATA_ORIGIN=http://mydata-server:8084

  service-ai-server:
    build:
      context: ../service-ai-server
    container_name: service-ai-server
    restart: unless-stopped
    depends_on:
      - postgres-analytics
      - postgres-vector
      - postgres-log
    #      - ollama
    env_file:
      - ../service-ai-server/.env.onpremise
    ports:
      - "8000:8000"
    # volumes:
    #   - huggingface_cache:/root/.cache/huggingface

  service-backend:
    build:
      context: ../service-backend
    container_name: service-backend
    restart: unless-stopped
    depends_on:
      - postgres-operational
      #      - postgres-analytics
      - postgres-log
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: onpremise
    ports:
      - "8080:8080"

  bank-server:
    build:
      context: ../bank-server
    container_name: bank-server
    restart: unless-stopped
    depends_on:
      oracle-onpremise:
        condition: service_healthy
      #kafka
    environment:
      SPRING_PROFILES_ACTIVE: onpremise
    ports:
      - "8081:8081"

  stock-server:
    build:
      context: ../stock-server
    container_name: stock-server
    restart: unless-stopped
    depends_on:
      oracle-onpremise:
        condition: service_healthy
      #kafka
    environment:
      SPRING_PROFILES_ACTIVE: onpremise
    env_file:
      - ../stock-server/.env
    ports:
      - "8082:8082"

  transaction-server:
    build:
      context: ../transaction-server
    container_name: transaction-server
    restart: unless-stopped
    depends_on:
      oracle-onpremise:
        condition: service_healthy
      #kafka
    environment:
      SPRING_PROFILES_ACTIVE: onpremise
    ports:
      - "8083:8083"

  mydata-server:
    build:
      context: ../mydata-server
    container_name: mydata-server
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: onpremise
    ports:
      - "8084:8084"

volumes:
  postgres_operational_data:
  postgres_analytics_data:
  postgres_log_data:
  postgres_vector_data:

  oracle_onpremise_data:

  huggingface_cache:

  ollama_data:
