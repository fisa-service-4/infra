  #     - sonar_db_data:/var/lib/postgresql/data

  # sonarqube:
  #   image: sonarqube:lts-community
  #   container_name: sonarqube
  #   restart: unless-stopped
  #   depends_on:
  #     - sonar-db
  #   environment:
  #     SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonarqube
  #     SONAR_JDBC_USERNAME: sonar
  #     SONAR_JDBC_PASSWORD: sonar
  #   ports:
  #     - "9000:9000"
  #   volumes:
  #     - sonarqube_data:/opt/sonarqube/data
  #     - sonarqube_extensions:/opt/sonarqube/extensions
  #     - sonarqube_logs:/opt/sonarqube/logs

  # =========================
  # APPLICATIONS
  # =========================

  bank-server:
    image: ghcr.io/fisa-service-4/bank-server:develop
#    build:
#      context: ../bank-server
    container_name: bank-server
    restart: unless-stopped
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: core
    ports:
      - "8081:8081"

  stock-server:
    image: ghcr.io/fisa-service-4/stock-server:develop
#    build:
#      context: ../stock-server
    container_name: stock-server
    restart: unless-stopped
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: core
    env_file:
      - ./stock-server.env
    ports:
      - "8082:8082"

  transaction-server:
    image: ghcr.io/fisa-service-4/transaction-server:develop
#    build:
#      context: ../transaction-server
    container_name: transaction-server
    restart: unless-stopped
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: core
    ports:
      - "8083:8083"

volumes:
  oracle_data:
