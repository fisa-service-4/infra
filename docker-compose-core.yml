services:

  # =========================
  # DATABASE
  # =========================

  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle
    restart: unless-stopped
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: 1234
      APP_USER: BANK
      APP_USER_PASSWORD: bank123
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 30
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./oracle-init:/container-entrypoint-initdb.d

  # =========================
  # KAFKA
  # =========================

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # =========================
  # CODE QUALITY
  # =========================
  #
  # [SonarQube 서버 활성화 방법]
  # 아래 sonar-db, sonarqube 블록의 '#' 주석을 제거하면 바로 사용 가능.
  # 기동 후 http://localhost:9000 접속 (초기 계정: admin / admin)
  #
  # ------------------------------------------------------------------
  # [각 서비스별 build.gradle에 추가해야 할 내용]
  # (bank-server, stock-server, transaction-server 모두 동일한 방법)
  #
  # ★ bank-server / stock-server / transaction-server (Java/Spring Boot)
  #
  #   [build.gradle] plugins 블록에 추가:
  #     id 'org.sonarqube' version '5.1.0.4882'
  #
  #   [build.gradle] 최하단에 sonar 블록 추가:
  #     sonar {
  #         properties {
  #             property "sonar.projectKey", "bank-server"  // 서비스마다 고유하게 변경
  #             property "sonar.host.url", "http://localhost:9000"
  #             property "sonar.token", "<SonarQube UI에서 발급한 토큰>"
  #         }
  #     }
  #
  #   [실행 명령] (각 서비스 디렉토리에서 실행):
  #     cd bank-server && ./gradlew sonar
  #     cd stock-server && ./gradlew sonar
  #     cd transaction-server && ./gradlew sonar
  #
  # ------------------------------------------------------------------
  #
  # [토큰 발급 방법]
  # 1. http://localhost:9000 접속 후 admin/admin 로그인
  # 2. My Account → Security → Generate Tokens
  # 3. 발급된 토큰을 위 sonar.token 또는 -Dsonar.token=<토큰> 으로 사용
  #
  # ------------------------------------------------------------------

